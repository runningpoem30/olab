databases:
  - name: olabs-postgres
    databaseName: olabs
    user: olabs
    region: oregon
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: olabs-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: olabs-api
    runtime: docker
    repo: https://github.com/runningpoem30/olab
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production

      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_SECRET
        generateValue: true
      - key: SLACK_STATE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: olabs-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: olabs-redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: emails
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: MIN_SEND_INTERVAL_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: "587"
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: SLACK_SUCCESS_REDIRECT_URL
        sync: false

  - type: worker
    name: olabs-worker
    runtime: docker
    repo: https://github.com/runningpoem30/olab
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: npm run start:worker
    region: oregon
    plan: starter
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: olabs-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: olabs-redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: emails
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: MIN_SEND_INTERVAL_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: "587"
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: SLACK_SUCCESS_REDIRECT_URL
        sync: false
